name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the package, the skill bundle, and the home-manager module check.
  flake:
    name: nix flake check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://firefly-toolbox.cachix.org
            extra-trusted-public-keys = firefly-toolbox.cachix.org-1:4RgCoc0+CS7QhRarG109VmWlnlYi+rQ5JYrCsRP5aK8=
      - run: nix flake check --quiet

  # The dev shell's own tools, so CI and `just check` cannot disagree on versions.
  check:
    name: just check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://firefly-toolbox.cachix.org
            extra-trusted-public-keys = firefly-toolbox.cachix.org-1:4RgCoc0+CS7QhRarG109VmWlnlYi+rQ5JYrCsRP5aK8=
      # Go's build and test caches, and golangci-lint's: a run only rebuilds and retests what changed.
      # Keyed per commit so every run saves; restore takes the newest from this branch, else main.
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('flake.lock', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('flake.lock', 'go.sum') }}-
      # A fixed TMPDIR inside the shell: nix develop makes a fresh one per run, and the tests read it,
      # so Go's test cache would never hit.
      - run: nix develop --quiet --command env TMPDIR="$RUNNER_TEMP" just check
        # Explicit: the dev shell's default cache paths are not where actions/cache looks. Blacksmith
        # runners set GOCACHEPROG, which bypasses GOCACHE and keeps no test results across jobs.
        env:
          GOCACHEPROG: ""
          GOCACHE: ${{ runner.temp }}/go-build
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
